---
- name: Check whether Tailscale is installed
  ansible.builtin.command: rpm -q tailscale
  register: tailscale_installation_package
  changed_when: false
  failed_when: false

- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install.sh
    mode: "0755"
  when: tailscale_installation_package.rc != 0

- name: Run Tailscale install script
  when: tailscale_installation_package.rc != 0
  block:
    - name: Run Tailscale install script
      ansible.builtin.command: bash -o pipefail /tmp/install.sh
      changed_when: true
      register: tailscale_installation_result
  rescue:
    - name: Retry Tailscale install script after failure
      ansible.builtin.command: bash -o pipefail /tmp/install.sh
      changed_when: true

- name: Ensure Tailscale is enabled and started (systemd)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Load Tailscale netfilter modules at boot
  ansible.builtin.template:
    src: tailscale-netfilter.conf.j2
    dest: /etc/modules-load.d/tailscale-netfilter.conf
    owner: root
    group: root
    mode: "0644"

- name: Load Tailscale netfilter modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - xt_mark
    - iptable_filter
