---
- name: Check if existing Pi-hole config is present
  ansible.builtin.stat:
    path: "{{ pihole_podman_config_file }}"
  register: pihole_podman_config_exists

- name: Restore Pi-hole data when migrating from a rebuilt VM
  ansible.builtin.include_tasks: restore.yml
  when: not pihole_podman_config_exists.stat.exists

- name: Stop legacy Docker Pi-hole before claiming host ports
  ansible.builtin.command: docker compose down
  args:
    chdir: "{{ pihole_podman_base_dir }}"
  become: true
  failed_when: false
  changed_when: true

- name: Disable legacy Docker service and socket on the Podman VM
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - docker.service
    - docker.socket
  become: true
  failed_when: false

- name: Ensure Pi-hole directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ template.user }}"
    group: "{{ template.user }}"
    mode: "0755"
  loop:
    - "{{ pihole_podman_base_dir }}"
    - "{{ pihole_podman_data_dir }}"

- name: Deploy Podman Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pihole_podman_compose_file }}"
    owner: "{{ template.user }}"
    group: "{{ template.user }}"
    mode: "0644"
  notify: Restart Pi-hole with Podman

- name: Start Pi-hole with Podman Compose
  ansible.builtin.command: podman-compose -f "{{ pihole_podman_compose_file }}" up -d
  args:
    chdir: "{{ pihole_podman_base_dir }}"
  become: true
  changed_when: true

- name: Configure firewalld for Pi-hole
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 53/tcp
    - 53/udp
    - 80/tcp
