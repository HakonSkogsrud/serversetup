---
- name: Reboot VM
  ansible.builtin.command:
    cmd: "qm reboot {{ create_vm_newid }}"
  listen: "reboot vm"
  changed_when: true

- name: Wait for VM SSH after reboot
  ansible.builtin.wait_for:
    host: "{{ create_vm_ipaddr }}"
    port: 22
    state: started
    search_regex: OpenSSH
    delay: 10
    timeout: 600
  delegate_to: localhost
  listen: "reboot vm"
