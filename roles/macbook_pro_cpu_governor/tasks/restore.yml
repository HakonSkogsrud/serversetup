---
- name: Restore MacBook Pro powersave mode after deployment
  become: true
  ansible.builtin.shell: |
    set -eu
    found=false
    for policy in /sys/devices/system/cpu/cpufreq/policy*; do
      [ -f "$policy/scaling_governor" ] || continue
      grep -qw {{ macbook_pro_cpu_governor_idle | quote }} "$policy/scaling_available_governors"
      echo {{ macbook_pro_cpu_governor_idle | quote }} > "$policy/scaling_governor"
      test "$(cat "$policy/scaling_governor")" = {{ macbook_pro_cpu_governor_idle | quote }}
      found=true
    done
    "$found"
    systemctl stop {{ macbook_pro_cpu_governor_fallback_unit | quote }}.timer || true
  args:
    executable: /bin/sh
  changed_when: true
