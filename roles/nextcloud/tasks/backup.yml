---
- name: Assert Nextcloud persistent storage is mounted
  ansible.builtin.command: "findmnt --noheadings --target {{ nextcloud_storage_path }} --types virtiofs"
  changed_when: false

- name: Deploy current Nextcloud backup script
  ansible.builtin.template:
    src: nextcloud-backup.sh.j2
    dest: "/usr/local/bin/{{ nextcloud_backup_script_name }}"
    owner: root
    group: root
    mode: "0750"

- name: Run Nextcloud backup
  ansible.builtin.command: "/usr/local/bin/{{ nextcloud_backup_script_name }}"
  environment:
    NEXTCLOUD_LEAVE_STOPPED: >-
      {{ '1' if nextcloud_backup_leave_stopped | default(false) | bool else '0' }}
  register: nextcloud_backup_run
  changed_when: true

- name: Verify fresh database dump exists
  ansible.builtin.find:
    paths: "{{ nextcloud_backup_path }}"
    patterns: "nextcloud-*.dump"
    file_type: file
    age: "-10m"
    size: 1
  register: nextcloud_fresh_backup
  failed_when: nextcloud_fresh_backup.matched | int == 0

- name: Verify persistent Nextcloud config exists
  ansible.builtin.stat:
    path: "{{ nextcloud_config_path }}/config.php"
  register: nextcloud_config_backup
  failed_when: not nextcloud_config_backup.stat.exists
