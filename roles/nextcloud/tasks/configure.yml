---
- name: Disable maintenance mode after database restore
  ansible.builtin.command:
    cmd: timeout 60 docker compose exec --user www-data --no-TTY app php occ maintenance:mode --off
    chdir: "{{ nextcloud_project_dir }}"
  register: nextcloud_maintenance_off
  retries: 30
  delay: 5
  until: nextcloud_maintenance_off.rc == 0
  changed_when: "'disabled' in nextcloud_maintenance_off.stdout"
  when: nextcloud_restore_required | bool

- name: Wait for Nextcloud status endpoint
  ansible.builtin.uri:
    url: "http://{{ vms.nextcloud.ip }}:{{ nextcloud_http_port }}/status.php"
    status_code: 200
  register: nextcloud_status
  retries: 30
  delay: 5
  until: nextcloud_status.status == 200

- name: Install pilot Nextcloud apps
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - app:install
      - "{{ item }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  loop: "{{ nextcloud_apps }}"
  register: nextcloud_app_install
  changed_when: >-
    'installed' in nextcloud_app_install.stdout and
    'already installed' not in nextcloud_app_install.stdout
  failed_when:
    - nextcloud_app_install.rc != 0
    - "'already installed' not in nextcloud_app_install.stdout"

- name: Configure built-in Nextcloud Office endpoint
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - config:app:set
      - richdocuments
      - wopi_url
      - "--value={{ nextcloud_office_internal_url }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  register: nextcloud_office_internal_config
  changed_when: "'updated' in nextcloud_office_internal_config.stdout"
  when: "'richdocumentscode' in nextcloud_apps"

- name: Validate built-in Nextcloud Office discovery endpoint
  ansible.builtin.uri:
    url: >-
      http://{{ vms.nextcloud.ip }}:{{ nextcloud_http_port }}/custom_apps/richdocumentscode/proxy.php?req=/hosting/discovery
    headers:
      Host: "{{ nextcloud_external_hostname }}"
    return_content: true
    status_code: 200
  register: nextcloud_office_discovery
  failed_when: "'<wopi-discovery>' not in nextcloud_office_discovery.content"
  when: "'richdocumentscode' in nextcloud_apps"

- name: Configure public and callback Nextcloud Office URLs
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - config:app:set
      - richdocuments
      - "{{ item.key }}"
      - "--value={{ item.value }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  loop:
    - { key: public_wopi_url, value: "{{ nextcloud_office_public_url }}" }
    - { key: wopi_callback_url, value: "{{ nextcloud_office_callback_url }}" }
  register: nextcloud_office_url_config
  changed_when: "'updated' in nextcloud_office_url_config.stdout"
  when: "'richdocumentscode' in nextcloud_apps"

- name: Permit only the Caddy VM to reach Nextcloud
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ vms.services.ip }}/32"
      port port="{{ nextcloud_http_port }}" protocol="tcp" accept
    permanent: true
    state: enabled
    immediate: true
