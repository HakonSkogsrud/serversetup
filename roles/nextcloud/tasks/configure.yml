---
- name: Disable maintenance mode after install or restore
  ansible.builtin.command:
    cmd: docker compose exec --user www-data --no-TTY app php occ maintenance:mode --off
    chdir: "{{ nextcloud_project_dir }}"
  register: nextcloud_maintenance_off
  retries: 30
  delay: 5
  until: nextcloud_maintenance_off.rc == 0
  changed_when: "'disabled' in nextcloud_maintenance_off.stdout"

- name: Wait for Nextcloud status endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nextcloud_http_port }}/status.php"
    status_code: 200
  register: nextcloud_status
  retries: 30
  delay: 5
  until: nextcloud_status.status == 200

- name: Read Tailscale node status
  ansible.builtin.command: tailscale status --json
  register: nextcloud_tailscale_status
  changed_when: false

- name: Derive Nextcloud Tailscale FQDN
  ansible.builtin.set_fact:
    nextcloud_tailscale_fqdn: >-
      {{ ((nextcloud_tailscale_status.stdout | from_json).Self.DNSName | default('nextcloud'))
         | regex_replace('\.$', '') }}

- name: Add Tailscale FQDN as a trusted domain
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - config:system:set
      - trusted_domains
      - "2"
      - "--value={{ nextcloud_tailscale_fqdn }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  changed_when: false

- name: Configure Tailscale HTTPS proxy for Nextcloud
  ansible.builtin.command:
    cmd: "tailscale serve --bg --https=443 http://127.0.0.1:{{ nextcloud_http_port }}"
  changed_when: true

- name: Install pilot Nextcloud apps
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - app:install
      - "{{ item }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  loop: "{{ nextcloud_apps }}"
  register: nextcloud_app_install
  changed_when: "'installed' in nextcloud_app_install.stdout"
  failed_when:
    - nextcloud_app_install.rc != 0
    - "'already installed' not in nextcloud_app_install.stdout"
