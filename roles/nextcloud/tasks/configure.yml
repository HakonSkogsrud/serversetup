---
- name: Disable maintenance mode after database restore
  ansible.builtin.command:
    cmd: timeout --foreground 60 docker compose exec --user www-data --no-TTY app php occ maintenance:mode --off
    chdir: "{{ nextcloud_project_dir }}"
  register: nextcloud_maintenance_off
  retries: 30
  delay: 5
  until: nextcloud_maintenance_off.rc == 0
  changed_when: "'disabled' in nextcloud_maintenance_off.stdout"
  when: nextcloud_restore_required | bool

- name: Wait for Nextcloud status endpoint
  ansible.builtin.uri:
    url: "http://{{ vms.nextcloud.ip }}:{{ nextcloud_http_port }}/status.php"
    status_code: 200
  register: nextcloud_status
  retries: 30
  delay: 5
  until: nextcloud_status.status == 200

- name: Install pilot Nextcloud apps
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - app:install
      - "{{ item }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  loop: "{{ nextcloud_apps }}"
  register: nextcloud_app_install
  changed_when: >-
    'installed' in nextcloud_app_install.stdout and
    'already installed' not in nextcloud_app_install.stdout
  failed_when:
    - nextcloud_app_install.rc != 0
    - "'already installed' not in nextcloud_app_install.stdout"

- name: Disable replaced built-in Nextcloud Office apps
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - app:disable
      - "{{ item }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  loop: "{{ nextcloud_legacy_office_apps }}"
  register: nextcloud_legacy_office_disable
  changed_when: "'disabled' in nextcloud_legacy_office_disable.stdout"
  failed_when:
    - nextcloud_legacy_office_disable.rc != 0
    - "'not installed' not in nextcloud_legacy_office_disable.stdout"

- name: Configure EuroOffice connector
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --user
      - www-data
      - --no-TTY
      - app
      - php
      - occ
      - config:app:set
      - eurooffice
      - "{{ item.key }}"
      - "--value={{ item.value }}"
  args:
    chdir: "{{ nextcloud_project_dir }}"
  loop:
    - { key: DocumentServerUrl, value: "{{ nextcloud_eurooffice_public_url }}" }
    - { key: DocumentServerInternalUrl, value: "{{ nextcloud_eurooffice_internal_url }}" }
    - { key: StorageUrl, value: "{{ nextcloud_eurooffice_storage_url }}" }
    - { key: jwt_secret, value: "{{ eurooffice_jwt_secret }}" }
  register: nextcloud_eurooffice_config
  changed_when: "'updated' in nextcloud_eurooffice_config.stdout"
  no_log: true

- name: Wait for EuroOffice health check
  ansible.builtin.uri:
    url: "http://{{ vms.nextcloud.ip }}:{{ nextcloud_eurooffice_http_port }}/healthcheck"
    return_content: true
    status_code: 200
  register: nextcloud_eurooffice_health
  retries: 30
  delay: 5
  until: nextcloud_eurooffice_health.content | trim == 'true'

- name: Wait for Nextcloud through the internal EuroOffice proxy
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - --no-TTY
      - eurooffice
      - curl
      - --fail
      - --silent
      - --show-error
      - http://nextcloud-internal/status.php
  args:
    chdir: "{{ nextcloud_project_dir }}"
  register: nextcloud_internal_proxy_status
  retries: 30
  delay: 5
  until: nextcloud_internal_proxy_status.rc == 0
  changed_when: false

- name: Verify the EuroOffice connector
  ansible.builtin.command:
    cmd: docker compose exec --user www-data --no-TTY app php occ eurooffice:documentserver --check
    chdir: "{{ nextcloud_project_dir }}"
  changed_when: false

- name: Permit only the Caddy VM to reach Nextcloud and EuroOffice
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ vms.services.ip }}/32"
      port port="{{ item }}" protocol="tcp" accept
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ nextcloud_http_port }}"
    - "{{ nextcloud_eurooffice_http_port }}"
