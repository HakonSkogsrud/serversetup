---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart nextcloud
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ nextcloud_project_dir }}"
  changed_when: true

- name: Recreate internal Nextcloud proxy
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --no-deps nextcloud-internal
    chdir: "{{ nextcloud_project_dir }}"
  changed_when: true
