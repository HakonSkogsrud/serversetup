---
- name: Install current kernel and Docker networking modules on RedHat
  ansible.builtin.package:
    name:
      - kernel
      - kernel-modules-extra
    state: latest
  when:
    - ansible_facts.get('os_family', '') == 'RedHat'
    # Backup-only plays intentionally do not gather facts. Their existing
    # Docker installation is sufficient; the subsequent configuration play
    # gathers facts and aligns the running kernel with the repository packages.
    - ansible_facts.get('kernel', '') | length > 0

- name: Find newest installed RedHat kernel
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      rpm -q kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' |
      sort -V | tail -n 1
    executable: /bin/bash
  register: docker_newest_installed_kernel
  changed_when: false
  when: ansible_facts.get('os_family', '') == 'RedHat'

- name: Reboot into kernel matching Docker networking modules
  ansible.builtin.reboot:
    msg: Rebooting into the current kernel before starting Docker
    reboot_timeout: 600
  when:
    - ansible_facts.get('os_family', '') == 'RedHat'
    - docker_newest_installed_kernel.stdout | default('') | trim != ansible_facts.get('kernel', '')

- name: Refresh facts after Docker kernel reboot
  ansible.builtin.setup:
  when:
    - ansible_facts.get('os_family', '') == 'RedHat'
    - docker_newest_installed_kernel.stdout | default('') | trim != ansible_facts.get('kernel', '')

- name: Load Docker networking kernel modules at boot on RedHat
  ansible.builtin.template:
    src: docker-netfilter.conf.j2
    dest: /etc/modules-load.d/docker-netfilter.conf
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts.get('os_family', '') == 'RedHat'

- name: Load Docker networking kernel modules now on RedHat
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - iptable_nat
    - xt_addrtype
    - br_netfilter
  when: ansible_facts.get('os_family', '') == 'RedHat'

- name: Ensure prerequisites are installed (yum-utils)
  ansible.builtin.dnf:
    name: yum-utils
    state: present
    update_cache: true

- name: Add Docker CE repository
  ansible.builtin.command:
    cmd: yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo
  changed_when: true

- name: Install Docker packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started # Ensure the service is running
    enabled: true # Ensure the service starts on boot

- name: Add user to the docker group
  ansible.builtin.user:
    name: "{{ template.user }}"
    groups: "{{ docker_group }}"
    append: true
