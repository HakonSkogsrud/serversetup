---
- name: Install kernel modules required by Docker networking on RedHat
  ansible.builtin.package:
    name: "kernel-modules-extra-{{ ansible_facts.get('kernel', ansible_kernel | default('')) }}"
    state: present
  when:
    - ansible_facts.get('os_family', ansible_os_family | default('')) == 'RedHat'
    # Backup-only plays intentionally do not gather facts. Their existing
    # Docker installation is sufficient; the subsequent configuration play
    # gathers facts and installs the matching kernel module package.
    - ansible_facts.get('kernel', ansible_kernel | default('')) | length > 0

- name: Load Docker networking kernel modules at boot on RedHat
  ansible.builtin.template:
    src: docker-netfilter.conf.j2
    dest: /etc/modules-load.d/docker-netfilter.conf
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts.get('os_family', ansible_os_family | default('')) == 'RedHat'

- name: Ensure prerequisites are installed (yum-utils)
  ansible.builtin.dnf:
    name: yum-utils
    state: present
    update_cache: true

- name: Add Docker CE repository
  ansible.builtin.command:
    cmd: yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo
  changed_when: true

- name: Install Docker packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started # Ensure the service is running
    enabled: true # Ensure the service starts on boot

- name: Add user to the docker group
  ansible.builtin.user:
    name: "{{ template.user }}"
    groups: "{{ docker_group }}"
    append: true
