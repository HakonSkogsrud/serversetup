---
# Storage and image configuration
create_template_vm_storage: local-lvm
create_template_vm_template_search_domain: "local"

create_template_vm_templates:
  - version: "9"
    vmid: "{{ template.vmid }}"
    name: "{{ template.name }}"
    image_url: "https://raw.repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
    image_filename: "AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
    checksum_url: "https://raw.repo.almalinux.org/almalinux/9/cloud/x86_64/images/CHECKSUM"
    # Preserve the existing AlmaLinux 9 cache when upgrading from the single-template setup.
    checksum_cache_file: "{{ create_template_vm_image_download_path }}/.alma_checksum_cache"
  - version: "10"
    vmid: "9001"
    name: "alma-10-cloud-template-automated"
    image_url: "https://raw.repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
    image_filename: "AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
    checksum_url: "https://raw.repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM"
    checksum_cache_file: "{{ create_template_vm_image_download_path }}/.alma_10_checksum_cache"

# Path where to store the downloaded image on the Proxmox host
create_template_vm_image_download_path: "/var/lib/vz/template/cache"

create_template_vm_script_name: "create_template_vm"

create_template_vm_uptimekuma_push_url: "http://10.0.0.44:3001/api/push/NXqJQyHSMTHrQKWCxE6297xZIrLNkt5h?status=up&msg=OK&ping="
