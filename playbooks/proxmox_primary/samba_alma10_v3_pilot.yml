---
- name: Register isolated Samba AlmaLinux 10 v3 pilot
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add pilot VM to the in-memory inventory
      ansible.builtin.add_host:
        name: samba-alma10-v3-pilot
        groups: samba_alma10_v3_pilot
        ansible_host: 10.0.0.84
        ansible_user: "{{ template.user }}"
      tags: [always]

- name: Create isolated Samba AlmaLinux 10 v3 pilot VM
  hosts: proxmox
  become: false
  vars_files:
    - ../../secrets.yml
  roles:
    - role: create_vm
      tags: [create]
      vars:
        create_vm_name: samba-alma10-v3-pilot
        create_vm_newid: 4904
        create_vm_ipaddr: 10.0.0.84
        create_vm_balloon: 1024
        create_vm_cores: 1
        create_vm_memory: 2048
        create_vm_sockets: 1
        create_vm_disk_size: 10G

- name: Configure and verify isolated Samba AlmaLinux 10 v3 pilot
  hosts: samba_alma10_v3_pilot
  become: true
  vars_files:
    - ../../secrets.yml
  vars:
    samba_mount_virtiofs: false
  pre_tasks:
    - name: Wait until the pilot accepts Ansible connections
      ansible.builtin.wait_for_connection:
        timeout: 300
      tags: [always]

    - name: Gather pilot facts
      ansible.builtin.setup:
      tags: [always]

    - name: Remove failed pilot VirtioFS mount entry
      ansible.posix.mount:
        path: /mnt/storage/smb
        state: absent
      tags: [always]

  roles:
    - role: samba
      tags: [samba]
    - role: scheduled_reboot
      tags: [maintenance]
    - role: scheduled_update
      tags: [maintenance]
    - role: alloy
      tags: [alloy]

  post_tasks:
    - name: Read installed RPM architectures
      ansible.builtin.command: rpm -qa --qf '%{ARCH}\n'
      register: samba_pilot_rpm_arches
      changed_when: false
      tags: [verify]

    - name: Read required service states
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - smb.service
        - nmb.service
        - firewalld.service
        - alloy.service
      register: samba_pilot_service_states
      changed_when: false
      tags: [verify]

    - name: Read Samba firewall service state
      ansible.builtin.command: firewall-cmd --query-service=samba
      register: samba_pilot_firewall
      changed_when: false
      tags: [verify]

    - name: Verify authenticated local Samba share listing
      ansible.builtin.command:
        argv:
          - smbclient
          - //127.0.0.1/share
          - --user={{ template.user }}%{{ samba_user_password }}
          - --command=ls
      register: samba_pilot_share_listing
      changed_when: false
      no_log: true
      tags: [verify]

    - name: Assert AlmaLinux 10 v3 Samba pilot health
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'AlmaLinux'
          - ansible_facts.distribution_major_version == '10'
          # AlmaLinux's default x86_64 repository has the v3 baseline; only
          # compatibility-image packages use the x86_64_v2 RPM architecture.
          - "'x86_64' in samba_pilot_rpm_arches.stdout_lines"
          - "'x86_64_v2' not in samba_pilot_rpm_arches.stdout_lines"
          - samba_pilot_service_states.results | map(attribute='stdout') | unique | list == ['active']
          - samba_pilot_firewall.stdout == 'yes'
          - samba_pilot_share_listing.rc == 0
        success_msg: AlmaLinux 10 v3 Samba pilot passed OS, service, firewall, and SMB checks
      tags: [verify]
