---
- name: Create tailscale subnet router VM (Secondary)
  hosts: proxmox2
  become: false
  vars_files:
    - ../../secrets.yml
  roles:
    - macbook_pro_cpu_governor
    - role: create_vm
      vars:
        create_vm_name: subnet-router-secondary
        create_vm_newid: "{{ vms['subnet-router-secondary'].vmid }}"
        create_vm_ipaddr: "{{ vms['subnet-router-secondary'].ip }}"
        create_vm_target_node: "{{ proxmox2.node }}"
        create_vm_balloon: 1500
        create_vm_cores: 1
        create_vm_memory: 3000
        create_vm_sockets: 1
        create_vm_disk_size: 10G

- name: Setup subnet router (Secondary)
  hosts: subnet-router-secondary
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for target to be reachable via SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
        connect_timeout: 5
        sleep: 5

    - name: Gather facts
      ansible.builtin.setup:

  vars:
    ansible_host_key_checking: false
    tailscale_subnet_router_hostname: subnet-router-secondary
    # Keep the HA pair from rebooting at the same time. The primary uses the
    # role default of Thursday at 00:00.
    scheduled_reboot_timer_calendar: "Thu *-*-* 00:30:00"
  vars_files:
    - ../../secrets.yml
  roles:
    - almalinux_vm_bootstrap
    - tailscale_subnet_router
    - tailscale_serve
    - scheduled_reboot
    - scheduled_update
    - alloy

- name: Restore secondary host power-saving mode
  hosts: proxmox2
  become: true
  tasks:
    - name: Restore secondary host power-saving mode
      ansible.builtin.include_role:
        name: macbook_pro_cpu_governor
        tasks_from: restore
